name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .
      - name: Unit tests (no model download)
        run: python -m pytest -q
      - name: Every number in the README must exist in results/ or runs/
        run: python scripts/check_card_numbers.py
      - name: Baselines-only evaluation must still run
        run: python -m delaysentinel.eval --skip-model --skip-cv --out /tmp/eval_ci.json
