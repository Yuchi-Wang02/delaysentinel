[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delaysentinel"
version = "1.0.1"
description = "A label-leakage case study around a Llama-3.2-1B-Instruct fine-tune on a synthetic logistics table (code MIT; the published weights are under the Llama 3.2 Community License)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-MIT", "THIRD_PARTY_LICENSES.md"]
authors = [{name = "Yuchi Wang"}]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
model = ["torch>=2.3", "transformers==4.55.4", "accelerate>=1.0", "huggingface_hub>=0.34,<1.0"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]
space = ["gradio>=5,<6"]

[project.scripts]
delaysentinel-eval = "delaysentinel.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# scripts/train.py is a third-party file kept byte-for-byte; legacy/ is the Sept 2025 code as it ran.
extend-exclude = ["scripts/train.py", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
