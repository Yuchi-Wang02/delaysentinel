<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc"><title id="title">A separate study on real orders</title><desc id="desc">Classical models on Olist use information available at checkout. Training orders were delivered before March 1, 2018; test orders were purchased on or after that date. Orders crossing the split are excluded. This study does not evaluate the Llama checkpoint.</desc><rect width="880" height="640" rx="24" fill="#101D31"/><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#AFC2D7}.white{fill:#F5F8FC}.mint{fill:#77E6C5}.label{font-size:19px;font-weight:700;letter-spacing:2px}.body{font-size:24px}.small{font-size:21px}.title{font-size:36px;font-weight:750}.metric{font-size:76px;font-weight:750}</style>
<text x="40" y="47" class="label mint">OLIST / CLASSICAL MODEL REFERENCE STUDY</text>
<text x="40" y="101" class="title white">Define the prediction before fitting it.</text>
<text x="40" y="148" class="body muted">Inputs available at checkout → later delivery outcome</text>
