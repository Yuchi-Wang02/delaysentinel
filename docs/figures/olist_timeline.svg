<text x="478" y="235" class="label mint">TEST</text><text x="478" y="282" class="white" font-size="30">Orders purchased</text><text x="478" y="318" class="white" font-size="30">on or after the cutoff</text><text x="478" y="357" class="small muted">A later prediction period</text>
